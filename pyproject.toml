[project]
name = "ml-service-template"
version = "0.1.0"
description = "Phase 0 deterministic ML service engineering baseline"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
ml-service = "ml_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
